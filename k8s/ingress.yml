apiVersion: networking.k8s.io/v1
kind: Ingress 
metadata:
  name: chat-app-ingress
  namespace: chat-app
  labels:
    name: chat-app-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
    - host: chat-tws.com 
      http:
        paths:  
        - path: / 
          pathType: Prefix
          backend:
            service:
              name: frontend-service
              port:
                number: 80
        - path: /api 
          pathType: Prefix
          backend:
            service:
              name: backend-service
              port:
                number: 5001